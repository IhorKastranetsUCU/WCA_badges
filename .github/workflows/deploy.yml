name: Deploy to AWS (OIDC)

on:
  push:
    branches: ["main"]

permissions:
  id-token: write   # Required for requesting the JWT for AWS OIDC
  contents: read    # Required for actions/checkout

jobs:
  lint-and-test:
    name: Lint & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Lint Backend
        run: |
          pip install ruff pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          cd backend && ruff check . && ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Lint Frontend
        run: |
          cd frontend && npm ci && npm run lint --if-present

  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Run Makefile deploy-frontend Target
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: make deploy-frontend

  deploy-backend:
    name: Deploy Backend (ECR + ECS Fargate)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Makefile deploy-backend Target
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: make deploy-backend
