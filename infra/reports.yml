AWSTemplateFormatVersion: '2010-09-09'
Description: 'Spry Event-Driven Weekly Reports Architecture (Lab 5: EventBridge Scheduler, SQS, S3, SES, Lambda)'

Parameters:
  ProjectName:
    Type: String
    Default: wca-badges
    Description: Project tag name

  ImageUri:
    Type: String
    Description: ECR Docker Image URI for the backend container

  SenderEmail:
    Type: String
    Default: kastranets.pn@ucu.edu.ua
    Description: Verified Amazon SES sender email address

  RecipientEmail:
    Type: String
    Default: kastranets.pn@ucu.edu.ua
    Description: Verified Amazon SES recipient email address

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0505d891aeb907a09
    Description: VPC ID where Builder Lambda resides

  RouteTableId:
    Type: String
    Default: rtb-0f6c8a00be5ec6ea6
    Description: Route table ID for S3 Gateway VPC Endpoint

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: 'subnet-0897a06b2403b2f3a,subnet-0a8786bfa162ecd38'
    Description: Subnets for Builder Lambda VPC configuration

Resources:
  # ============================================================================
  # 1. S3 Bucket & VPC Endpoint (Step 2 & Step 5)
  # ============================================================================

  # Explicit name prevents circular dependency with Lambda permission
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: ReportMailerS3Permission
    Properties:
      BucketName: !Sub '${ProjectName}-reports-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteReportsAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
            Function: !GetAtt ReportMailerFunction.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # S3 Gateway Endpoint attached to Lambda subnet route tables (Free, no NAT needed)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref VpcId
      RouteTableIds:
        - !Ref RouteTableId

  # ============================================================================
  # 2. SQS Queue & DLQ (Step 4)
  # ============================================================================

  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-report-requests-dlq'
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-report-requests'
      VisibilityTimeout: 360 # 6x builder timeout (60s * 6)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ============================================================================
  # 3. Security Groups & IAM Roles
  # ============================================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Builder Lambda in VPC
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-report-builder-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3AndSqsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/*'
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-report-mailer-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-reports-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SqsSendMessage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ============================================================================
  # 4. Lambda Functions (Builder in VPC, Mailer outside VPC)
  # ============================================================================

  ReportBuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-report-builder'
      Description: Spry weekly report builder running inside VPC
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.reports.lambda_handler.handler
      Role: !GetAtt BuilderExecutionRole.Arn
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          REPORTS_BUCKET_NAME: !Sub '${ProjectName}-reports-${AWS::AccountId}'
          PROJECT_NAME: !Ref ProjectName
          AWS_ACCOUNT_ID: !Ref 'AWS::AccountId'
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilderEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !GetAtt ReportBuilderFunction.Arn
      BatchSize: 1
      Enabled: true

  ReportMailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-report-mailer'
      Description: Spry report mailer running outside VPC with SES access
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MailerExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          RECIPIENT_EMAILS: !Ref RecipientEmail
      Code:
        ZipFile: |
          import json, os, logging, boto3
          from email.message import EmailMessage
          from urllib.parse import unquote_plus

          logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")
          logger = logging.getLogger("report-mailer")
          logger.setLevel(logging.INFO)

          s3_client = boto3.client("s3")
          ses_client = boto3.client("sesv2")

          def handler(event, context):
              records = event.get("Records", [])
              if not records:
                  return {"statusCode": 400}
              s3_data = records[0].get("s3", {})
              bucket = s3_data.get("bucket", {}).get("name")
              raw_key = s3_data.get("object", {}).get("key", "")
              key = unquote_plus(raw_key)

              # CloudWatch log required line format
              logger.info(f"report-mailer triggered trigger=s3 bucket={bucket} key={key}")

              if not key.startswith("reports/") or not key.endswith(".csv"):
                  logger.info("Ignoring non-csv report key")
                  return {"statusCode": 200, "message": "Ignored"}

              logger.info(f"Downloading s3://{bucket}/{key}")
              s3_resp = s3_client.get_object(Bucket=bucket, Key=key)
              csv_bytes = s3_resp["Body"].read()

              sender = os.environ.get("SENDER_EMAIL", "kastranets.pn@ucu.edu.ua")
              recipient_env = os.environ.get("RECIPIENT_EMAILS", "kastranets.pn@ucu.edu.ua")
              recipients = [r.strip() for r in recipient_env.split(",") if r.strip()]

              filename = key.split("/")[-1]
              week_label = filename.replace(".csv", "")

              msg = EmailMessage()
              msg["Subject"] = f"Spry Weekly Report — {week_label}"
              msg["From"] = sender
              msg["To"] = ", ".join(recipients)
              msg.set_content(
                  f"Hi there,\n\n"
                  f"The Spry Weekly Meetings Report for {week_label} has been generated and is attached.\n\n"
                  f"S3 Object: s3://{bucket}/{key}\n"
                  f"Payload Size: {len(csv_bytes)} bytes\n\n"
                  f"Best regards,\n"
                  f"Spry Automated Reports Engine"
              )
              msg.add_attachment(csv_bytes, maintype="text", subtype="csv", filename=filename)

              logger.info(f"Sending email via SES to {recipients} from {sender}")
              res = ses_client.send_email(
                  FromEmailAddress=sender,
                  Destination={"ToAddresses": recipients},
                  Content={"Raw": {"Data": msg.as_bytes()}},
              )
              logger.info(f"Email sent successfully. MessageId={res.get('MessageId')}")
              return {"statusCode": 200, "trigger": "s3", "key": key}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailerS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ReportMailerFunction.Arn
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}'
      SourceAccount: !Ref 'AWS::AccountId'

  # ============================================================================
  # 5. EventBridge Scheduler (Step 3 & Step 4)
  # ============================================================================

  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-weekly-report-schedule'
      Description: Dispatches weekly report generation command to SQS every Monday at 07:00 Europe/Kyiv
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: "Europe/Kyiv"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

Outputs:
  ReportsBucketName:
    Description: S3 bucket for storing weekly reports
    Value: !Ref ReportsBucket

  ReportRequestsQueueUrl:
    Description: SQS Queue URL for requesting reports
    Value: !Ref ReportRequestsQueue

  ReportRequestsDlqUrl:
    Description: SQS Dead-Letter Queue URL
    Value: !Ref ReportRequestsDlq

  ReportBuilderFunctionName:
    Description: Builder Lambda function name
    Value: !Ref ReportBuilderFunction

  ReportMailerFunctionName:
    Description: Mailer Lambda function name
    Value: !Ref ReportMailerFunction
