AWSTemplateFormatVersion: '2010-09-09'
Description: 'Spry AI Agenda Parser Architecture (Lab 6: Amazon Bedrock, Claude, Lambda Function URL)'

Parameters:
  ProjectName:
    Type: String
    Default: wca-badges
    Description: Name of the project tag

  ImageUri:
    Type: String
    Description: ECR Docker Image URI for the backend container

  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Amazon Bedrock model ID for agenda parsing

  CognitoUserPoolId:
    Type: String
    Default: us-east-1_T7FaZwE2p
    Description: Cognito User Pool ID for token verification

  FrontendUrl:
    Type: String
    Default: https://d3genjzo563rwc.cloudfront.net
    Description: Deployed frontend URL for CORS

Resources:
  # ============================================================================
  # 1. IAM Execution Role for Agenda Parser Lambda
  # ============================================================================
  AgendaParserExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-agenda-parser-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInferencePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock-runtime:Converse
                Resource: '*'
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ============================================================================
  # 2. Agenda Parser Lambda Function (Outside VPC: 512 MB, 30s timeout)
  # ============================================================================
  AgendaParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-agenda-parser'
      Description: Parses unstructured text into structured meeting agendas using Amazon Bedrock
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.ai.agenda_lambda.handler
      Role: !GetAtt AgendaParserExecutionRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: production
          PROJECT_NAME: !Ref ProjectName
          PARSER_MODEL: !Ref ParserModel
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Ref AWS::Region
          CORS_ORIGINS: !Sub '${FrontendUrl},http://localhost:5173,*'
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ============================================================================
  # 3. Public Lambda Function URL (AuthType: NONE, CORS for frontend)
  # ============================================================================
  AgendaParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AgendaParserFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - '*'
        AllowHeaders:
          - '*'
        MaxAge: 86400

  # ============================================================================
  # 4. Public Invoke Permission for the Function URL
  # ============================================================================
  AgendaParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  AgendaParserFunctionArn:
    Description: ARN of the Agenda Parser Lambda function
    Value: !GetAtt AgendaParserFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-AgendaParserFunctionArn'

  AgendaParserUrl:
    Description: Public Function URL for the Agenda Parser
    Value: !GetAtt AgendaParserFunctionUrl.FunctionUrl
    Export:
      Name: !Sub '${ProjectName}-AgendaParserUrl'
